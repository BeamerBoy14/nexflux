name: Deploy

on:
  push:
    branches: [master]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app (ASP.NET Core)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/beamerboy14/nexflux-app:latest
          cache-from: type=gha,scope=nexflux-app
          cache-to: type=gha,mode=max,scope=nexflux-app

  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: nexflux
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            ASPNETCORE_ENVIRONMENT=Production
            DB_SA_PASSWORD=${{ secrets.DB_SA_PASSWORD }}
            SEED_TRANSERALEGEND_PASSWORD=${{ secrets.SEED_TRANSERALEGEND_PASSWORD }}
            SEED_ENTREPRISE2_PASSWORD=${{ secrets.SEED_ENTREPRISE2_PASSWORD }}
